<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./indexcss.css">
    <script src="./script.js"></script>
</head>

<body>

    <div style="text-align: end;" class="nodisplay p-2">
        <div class="mt-5 d-flex align-items-center gap-2">
            <!-- <input type="text" id="uname" placeholder="Enter Office Name"> -->
            <select name="nameSelect" id="uname" onchange="searchData()" class="form-select form-input-group d-none">
                <option value="Nellore ICH">Nellore TMO</option>
                <option value="Cuddapah ICH">Cuddapah TMO</option>
                <option value="Chennai NSH">Chennai Central TMO</option>
                <option value="Hyderabad NSH">Hyderabad Dec RSTMO</option>
                <option value="Bengaluru NSH">Bengaluru B/S TMO</option>
            </select>

        </div>
        <br>
        <div id="buttonsContainer" class="p-4">
            <div class="mt-3">
                <button onclick="getBags()" class="btn btn-info w-100">TB Bags MG1</button>
            </div>
            <div class="mt-3">
                <button onclick="getBagsMG2()" class="btn btn-info w-100">Loose Bags First</button>
            </div>
            <div class="mt-3">
                <button onclick="getBagsTMO1()" class="btn btn-info w-100">Loose Bags Sec</button>
            </div>
            <div class="mt-3">
                <button onclick="getChennai()" class="btn btn-info w-100">Chennai NSH</button>
            </div>
            <div class="mt-3">
                <button onclick="getChennaiSide()" class="btn btn-info w-100">Chennai Side</button>
            </div>
            <div class="mt-3">
                <button onclick="getV10IN()" class="btn btn-info w-100">V - 10 - IN</button>
            </div>
            <div class="mt-3">
                <button onclick="getNellore()" class="btn btn-info w-100">Nellore TMO</button>
            </div>
            <div class="mt-3">
                <button onclick="getGuntur()" class="btn btn-info w-100">Guntur TMO</button>
            </div>
            <div class="mt-3">
                <button onclick="getOngole()" class="btn btn-info w-100">Ongole TMO</button>
            </div>
            <div class="mt-3">
                <button onclick="getVijayawada()" class="btn btn-info w-100">Vijayawada TMO</button>
            </div>
            <div class="mt-3">
                <button onclick="getKadapa()" class="btn btn-info w-100">Kadapa TMO</button>
            </div>
            <div class="mt-3">
                <button onclick="getKurnool()" class="btn btn-info w-100">Kurnool TMO</button>
            </div>
            <div class="mt-3">
                <button onclick="getAnanthapur()" class="btn btn-info w-100">Ananthapur TMO</button>
            </div>
            <div class="mt-3">
                <button onclick="getHyderabad()" class="btn btn-info w-100">Hyd Dec RSTMO</button>
            </div>
            <div class="mt-3">
                <button onclick="getY32in()" accesskey="y" class="btn btn-info w-100">Y - 32 - IN</button>
            </div>
            <div class="mt-3">
                <button onclick="getAg27in()" class="btn btn-info w-100">AG - 27 - IN</button>
            </div>
            <div class="mt-3">
                <button onclick="getTirupatiNDC()" class="btn btn-info w-100">Tirupati NDC</button>
            </div>
            <div class="mt-3">
                <button onclick="getTirupatiIDC()" accesskey="t" class="btn btn-info w-100">Tirupati IDC</button>
            </div>
            <div class="mt-3">
                <button onclick="excelExport()" class="bi bi-printer-fill btn btn-outline-dark ms-auto w-100"> Excel
                    Export</button>
            </div>
            <div class="mt-3">
                <button onclick="printReport()" accesskey="p"
                    class="bi bi-printer-fill btn btn-outline-dark ms-auto w-100"> <u>P</u>rint
                    MailList</button>
            </div>
        </div>
        <br>
        <div class="mt-2">
            <input type="text" placeholder="Bag Number to Delete" id="deleteBag" class="form-control mb-2">
            <button onclick="deleteBagClick()" class="btn btn-info w-100">Delete Bag</button>
        </div>
    </div>
    <div id=tableDiv class="py-5">
        <div id="header">
            <div id="ashok">
                <img src="./images/ashok.png" alt="" width="80" height="80">
            </div>
            <div class="text-center">
                <div>Department of Posts :: India</div>
                <div>Tirupati TMO - 517501</div>
                <div id="maillist" style="text-wrap: nowrap;position: relative;z-index: 100;"></div>
            </div>
            <div id="logo">
                <img src="./images/logo.png" alt="" width="140" height="80">
            </div>
        </div>

        <br>
        <table>
            <thead>

                <tr>
                    <th style="border-top-left-radius: 10px;">SNO</th>
                    <th>Bag Number</th>
                    <th>Bag Type</th>
                    <th>From Office</th>
                    <th style="border-top-right-radius: 10px;">Bag Closed To</th>
                </tr>
            </thead>
            <tbody id="tbody">

            </tbody>
            <tfoot>
                <td style="border-bottom-left-radius: 10px;">&nbsp;</td>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td style="border-bottom-right-radius: 10px;">&nbsp;</td>
            </tfoot>

        </table>
        <br><br>
        <div id="countSignContainer">
            <div id="signContainer">
                <img src="./images/sing.png" alt="" width="120" height="80"><br>

                <p style="margin:0;line-height: 1.5;">MailList Prepared By</p>
                <p style="margin:0;line-height: 1.5;">Sri Hari Muppori ( 10163797 )</p>

            </div>
            <div id="countContainer">
                <p id="tbBags"></p>
                <p id="spBags"></p>
                <p id="omBags"></p>
                <p id="plBags"></p>
                <p id="mpBags"></p>
                <div style="border: 2px solid black;margin-top: 5px;"></div>
                <p id="totalBags"></p>
                <div style="border: 2px solid black;margin-top: 5px;"></div>
                <!-- <p id="dangerBagNumber"></p> -->
            </div>

        </div>
        <div id="totalFigure" style="width: 100px;">
            <div id="usual"></div>
            <div id="unusual"></div>
            <div style="border: 2px solid black;" id="border"></div>
            <div id="total"></div>
        </div>
    </div>

</body>

</html>
